<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16100C" />
    <!--
      Search metadata for this document.

      Everything between these two markers is replaced, per route, by whoever
      answers the request: `scripts/build-seo.mjs` writes one file per route for
      the static build, and the Express host rewrites this block for the shell it
      serves (see `shared/seo.js`). The React app then keeps it current as the
      customer navigates.

      As written here it is the home page's metadata — the honest fallback for any
      path nobody described. Note what is *absent*: no canonical and no og:url.
      Those have to name the address the page is actually served from, and a
      domain typed into the source is how a shop ends up telling Google it is a
      duplicate of somebody else's website.
    -->
    <!--seo:start-->
    <title>South African Plates in Rosebank &amp; Sandton — Heritage Bites</title>
    <meta
      name="description"
      content="South African plates from R100 — mogodu, tshotlo, tlhakwana, smiley, wings and short rib. Cooked Thursdays and Fridays, delivered in Rosebank and Sandton."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <!--
      The canonical, and the address it names.

      This file is Vite's source entry, and it is also what GitHub Pages serves at
      the repository root — the first address a crawler finds for this shop. It
      used to carry no canonical and no structured data at all, so the root was
      indexed as an undescribed page competing with the eight real ones.

      The address includes `/web/` because that is the folder Pages actually
      publishes; the built home lives there. `scripts/build-seo.mjs` writes the
      same address into every built page and into `sitemap.xml`, and
      `scripts/build-pages.mjs` bakes it into the bundle so the canonical a browser
      ends up with matches the one written here — two canonicals for one page is
      the duplicate-content signal this whole setup exists to avoid.

      A build replaces everything between the markers below with the real head, so
      this block only has to be right for the unbundled root document.
    -->
    <link rel="canonical" href="https://lulamilemkhungela.github.io/heritagebites/web/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "@id": "https://lulamilemkhungela.github.io/heritagebites/web/#restaurant",
        "name": "Heritage Bites",
        "slogan": "Every Bite Tells a Story",
        "description": "Traditional and contemporary South African plates, cooked in small batches on Thursdays and Fridays and delivered in Sandton and Rosebank, and up to 15 km from the kitchen.",
        "url": "https://lulamilemkhungela.github.io/heritagebites/web/",
        "hasMenu": "https://lulamilemkhungela.github.io/heritagebites/web/menu",
        "image": "https://lulamilemkhungela.github.io/heritagebites/web/img/social-card.jpg",
        "telephone": "+27670137587",
        "email": "heritagebitesfood@gmail.com",
        "servesCuisine": "South African",
        "priceRange": "R100–R130",
        "currenciesAccepted": "ZAR",
        "paymentAccepted": "Cash, Credit Card",
        "foundingDate": "2025",
        "hasDeliveryMethod": "http://purl.org/goodrelations/v1#DeliveryModeOwnFleet",
        "areaServed": [
          { "@type": "City", "name": "Rosebank" },
          { "@type": "City", "name": "Sandton" }
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Thursday", "Friday"],
            "opens": "12:00",
            "closes": "13:30"
          }
        ]
      }
    </script>
    <meta property="og:site_name" content="Heritage Bites" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="South African Plates in Rosebank &amp; Sandton — Heritage Bites" />
    <meta
      property="og:description"
      content="South African plates from R100 — mogodu, tshotlo, tlhakwana, smiley, wings and short rib. Cooked Thursdays and Fridays, delivered in Rosebank and Sandton."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:end-->
    <!--
      The logo, everywhere a browser or a phone wants one.

      The tab icon is the pot from the badge rather than the whole badge: at 16px
      the ring of lettering is a grey smudge, and the pot is the one shape that
      survives the size. The full badge is used where there is room — the header,
      the footer and the share card. See scripts/build-brand-assets.py.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The name under the icon on a home screen.

      iOS reads apple-mobile-web-app-title and IGNORES the manifest's short_name,
      so without this line an iPhone keeps whatever title the page had when it
      was added — "South African Plates in Rosebank & Sandton", which is a
      description, not a name. Owner, 18 Nov 2026: "it must be HeritageBites full
      or one word" — the one word is the same as the manifest's, so all three
      platforms agree.
    -->
    <meta name="application-name" content="HeritageBites" />
    <meta name="apple-mobile-web-app-title" content="HeritageBites" />
    <!--
      Typefaces are self-hosted from /fonts (declared in src/index.css). The
      site makes no third-party font request, so it renders identically on a
      network that blocks Google, and first paint no longer waits on a
      stylesheet from another origin.
      The first Fraunces rule above is a variable-range declaration; the explicit
      weight rules after it exist because the latin subsets are static files.
    -->
    <link rel="preload" href="/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>

      two rings, so the wait looks like the brand rather than a generic spinner.

      It paints on the first HTML byte, before the CSS or the JS bundle have

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      This file is the *source* entry: it points at /src/main.tsx, which only
      Vite can serve. If it is ever opened directly by a browser — which is what
      happens when GitHub Pages publishes the repository root instead of the
      built folder — nothing can mount, and the visitor gets a white screen with
      no explanation.

      So: when this document is being served unbundled, hand over to the built
      preview in ./web/. The check is deliberately narrow.

        - `script[src$=".tsx"]` only exists before a build. In the built site
          Vite has already rewritten it to /assets/index-*.js, so this never
          fires on the Express host.
        - `@vite/client` means the dev server is serving us, where /src/main.tsx
          is perfectly valid and redirecting would be wrong.
    -->
    <script>
      (function () {
        var dev = document.querySelector('script[src*="@vite/client"]');
        var unbundled = document.querySelector('script[src$=".tsx"]');
        if (!dev && unbundled) window.location.replace('./web/');
      })();
    </script>
