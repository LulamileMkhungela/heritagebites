# ============================================================================
# Render Blueprint — the full Heritage Bites site (Express API + built
# frontend) on Render's free plan, with its own onrender.com address.
#
# What this file is for: nobody should have to retype the deployment settings
# by hand. Create the service from the blueprint and Render fills in the plan,
# the region, the build and start commands and every non-secret environment
# variable below. Nothing about heritagebites.co.za changes — the Pretoria
# WordPress site on that domain is untouched; this lives on its own address.
#
# To deploy (step by step: docs/render-deploy.md):
#
#   dashboard.render.com → New + → Blueprint → pick this repository
#
# Render asks for the two values a public repository must never hold — copy
# them from the server's .env (or regenerate with `npm run push:keys`):
#
#   HB_VAPID_PRIVATE_KEY    signs every Web Push notification
#   HB_OWNER_PUSH_KEY       the enrolment password for the /alerts page
#
# Expectations on the free plan (also in docs/render-deploy.md): the service
# sleeps after ~15 minutes of inactivity and wakes in about a minute, and the
# filesystem is wiped on every deploy — orders do not survive a redeploy, which
# is acceptable for testing and is not acceptable for the real service window
# (add a persistent disk before then).
#
# If the service name "heritagebites" is taken and you choose another, update
# HB_PUBLIC_URL and HB_SITE_URL in the Environment tab to the address Render
# actually assigned, so tracking links and canonical URLs stay correct.
# ============================================================================
services:
  - type: web
    name: heritagebites
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render's proxy sits in front of the Node process, so Express must read
      # X-Forwarded-For for the rate limiter to see distinct customers.
      - key: HB_TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
      # --- Web Push (the instant buzz on the kitchen phone) -------------------
      - key: HB_VAPID_PUBLIC_KEY
        value: BLBKMk0bL-_1bbKKoznaROWnwRPCNDq5pXGK_YaS_O7tOmldOVlwNQAGAjVSsBXxVtw8dQKGJtJjSDFs6lHupc0
      - key: HB_VAPID_PRIVATE_KEY
        sync: false
      - key: HB_VAPID_SUBJECT
        value: mailto:mkhungela.l@gmail.com
      - key: HB_OWNER_PUSH_KEY
        sync: false
      # --- the public address of this deployment -------------------------------
      # Used for the customer's tracking link (HB_PUBLIC_URL) and for the
      # canonical/og URLs written during the build (HB_SITE_URL).
      # One-off trading days beyond Thursday/Friday (a Saturday market, a
      # holiday): set HB_SPECIAL_SERVICE_DAYS=2026-11-21,2026-12-05 here to
      # trade on those dates only, and remove it afterwards. It is a promise to
      # cook and deliver those days, so set it only for days the business is
      # really trading. See README → "One-off service days".
      # - key: HB_SPECIAL_SERVICE_DAYS
      #   value: "2026-11-21"
      - key: HB_PUBLIC_URL
        value: https://heritagebites.onrender.com
      - key: HB_SITE_URL
        value: https://heritagebites.onrender.com
