    <!--
      Theme, before first paint.

      This has to be inline and synchronous: React mounts after the browser has
      already painted, so a theme applied by a component shows a dark-mode
      customer the light palette for as long as the bundle takes to parse. It is
      six lines and no network cost.

      No stored value means "follow the device", which is what `color-scheme:
      light dark` in the stylesheet already does — so the common case sets no
      attribute at all and the `light-dark()` tokens resolve themselves.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hb.theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#071120' : '#001938');
        } catch (e) {}
      })();
    </script>
    <!--

    <!--
      This file is the *source* entry: it points at /src/main.tsx, which only
      Vite can serve. If it is ever opened directly by a browser — which is what
      happens when GitHub Pages publishes the repository root instead of the
      built folder — nothing can mount, and the visitor gets a white screen with
      no explanation.

      So: when this document is being served unbundled, hand over to the built
      preview in ./web/. The check is deliberately narrow.

        - `script[src$=".tsx"]` only exists before a build. In the built site
          Vite has already rewritten it to /assets/index-*.js, so this never
          fires on the Express host.
        - `@vite/client` means the dev server is serving us, where /src/main.tsx
          is perfectly valid and redirecting would be wrong.
    -->
    <script>
      (function () {
        var dev = document.querySelector('script[src*="@vite/client"]');
        var unbundled = document.querySelector('script[src$=".tsx"]');
        if (!dev && unbundled) window.location.replace('./web/');
      })();
    </script>
