      The first Fraunces rule above is a variable-range declaration; the explicit

    -->
    <link rel="preload" href="./fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />

  <body>
    <div id="root"></div>
    <!--
      This file is the *source* entry: it points at /src/main.tsx, which only
      Vite can serve. If it is ever opened directly by a browser — which is what
      happens when GitHub Pages publishes the repository root instead of the
      built folder — nothing can mount, and the visitor gets a white screen with
      no explanation.

      So: when this document is being served unbundled, hand over to the built
      preview in ./web/. The check is deliberately narrow.

        - `script[src$=".tsx"]` only exists before a build. In the built site
          Vite has already rewritten it to /assets/index-*.js, so this never
          fires on the Express host.
        - `@vite/client` means the dev server is serving us, where /src/main.tsx
          is perfectly valid and redirecting would be wrong.
    -->
    <script>
      (function () {
        var dev = document.querySelector('script[src*="@vite/client"]');
        var unbundled = document.querySelector('script[src$=".tsx"]');
        if (!dev && unbundled) window.location.replace('./web/');
      })();
    </script>
